<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Книжные конспекты</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1b1f1d;--mut:#6b746f;--ac:#1f6f54;--acb:#e6f2ec;--bd:#dfe3e0;--dg:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--card:#1c211e;--tx:#eef1ef;--mut:#9aa39e;--ac:#5fc79f;--acb:#1f3a2f;--bd:#2d3430;--dg:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121513;--card:#1c211e;--tx:#eef1ef;--mut:#9aa39e;--ac:#5fc79f;--acb:#1f3a2f;--bd:#2d3430;--dg:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{flex:1;margin:0;font-size:22px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--acb);color:var(--ac);font-weight:600;cursor:pointer}
button.p{background:var(--ac);color:var(--bg)}
button.d{color:var(--dg);background:transparent;padding:8px}
button.g{background:transparent;color:var(--ac);padding:8px 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.card.click{cursor:pointer}
.ico{width:42px;height:54px;border-radius:6px;background:var(--acb);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.row{display:flex;gap:8px;margin-bottom:14px}
input[type=text]{flex:1;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);min-width:0}
.note{font-size:12px;color:var(--mut);margin-top:18px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DB='booknotes',ST='pdfs';
let db=null,books=[],files=[],cur=null,mem=false;
try{books=JSON.parse(localStorage.getItem('bn_books')||'[]')}catch(e){}
const saveBooks=()=>{try{localStorage.setItem('bn_books',JSON.stringify(books))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
const memStore=[];

function openDB(){return new Promise(res=>{
 try{const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id'});
 r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null)}})}
const tx=(m)=>db.transaction(ST,m).objectStore(ST);
const all=()=>new Promise(res=>{if(!db)return res(memStore.slice());const r=tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>res([])});
const put=rec=>new Promise(res=>{if(!db){memStore.push(rec);return res()}const r=tx('readwrite').put(rec);r.onsuccess=r.onerror=()=>res()});
const del=id=>new Promise(res=>{if(!db){const i=memStore.findIndex(x=>x.id===id);if(i>-1)memStore.splice(i,1);return res()}const r=tx('readwrite').delete(id);r.onsuccess=r.onerror=()=>res()});

async function refresh(){files=await all();render()}

function render(){
 const app=document.getElementById('app');
 if(!cur){
  app.innerHTML=`<h1>Мои книги</h1><p class="sub">Конспекты и PDF по каждой книге</p>
  <div class="row"><input type="text" id="nb" placeholder="Название книги" maxlength="80"><button class="p" id="add">Добавить</button></div>
  ${books.length?books.map(b=>{const n=files.filter(f=>f.book===b.id).length;
   return `<div class="card click" data-b="${b.id}"><div class="ico">📕</div><div class="grow"><div class="t">${esc(b.name)}</div><div class="m">${n} ${n===1?'файл':'файлов'}</div></div><span class="m">›</span></div>`}).join(''):
   '<div class="empty">Пока нет книг.<br>Введите название и нажмите «Добавить».</div>'}
  <p class="note">${mem?'Хранилище недоступно: файлы сохранятся только до закрытия страницы.':'Файлы хранятся на этом устройстве, в браузере.'}</p>`;
  const add=()=>{const i=document.getElementById('nb');const v=i.value.trim();if(!v)return;books.push({id:uid(),name:v});saveBooks();render()};
  document.getElementById('add').onclick=add;
  document.getElementById('nb').onkeydown=e=>{if(e.key==='Enter')add()};
  app.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{cur=el.dataset.b;render()});
 }else{
  const b=books.find(x=>x.id===cur);if(!b){cur=null;return render()}
  const fl=files.filter(f=>f.book===cur).sort((a,c)=>c.added-a.added);
  app.innerHTML=`<div class="top"><button class="g" id="back">‹ Книги</button></div>
  <h1>${esc(b.name)}</h1><p class="sub">${fl.length} ${fl.length===1?'файл':'файлов'}</p>
  <div class="row"><button class="p" id="up">+ Добавить PDF</button><button id="rn">Переименовать</button><button class="d" id="db">Удалить книгу</button></div>
  <input type="file" id="fi" accept="application/pdf,.pdf" multiple hidden>
  ${fl.length?fl.map(f=>`<div class="card"><div class="ico">📄</div><div class="grow"><div class="t">${esc(f.name)}</div><div class="m">${fmt(f.size)} · ${new Date(f.added).toLocaleDateString('ru-RU')}</div></div><button data-o="${f.id}">Открыть</button><button class="d" data-x="${f.id}">✕</button></div>`).join(''):
  '<div class="empty">В этой книге пока нет файлов.</div>'}`;
  document.getElementById('back').onclick=()=>{cur=null;render()};
  const fi=document.getElementById('fi');
  document.getElementById('up').onclick=()=>fi.click();
  fi.onchange=async()=>{for(const f of fi.files){await put({id:uid(),book:cur,name:f.name.replace(/\.pdf$/i,''),size:f.size,added:Date.now(),blob:f})}refresh()};
  document.getElementById('rn').onclick=()=>{const v=prompt('Новое название',b.name);if(v&&v.trim()){b.name=v.trim();saveBooks();render()}};
  document.getElementById('db').onclick=async()=>{if(!confirm('Удалить книгу и все её файлы?'))return;for(const f of fl)await del(f.id);books=books.filter(x=>x.id!==cur);saveBooks();cur=null;refresh()};
  app.querySelectorAll('[data-x]').forEach(el=>el.onclick=async()=>{if(confirm('Удалить файл?')){await del(el.dataset.x);refresh()}});
  app.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>openPdf(files.find(f=>f.id===el.dataset.o)));
 }
}

async function openPdf(f){
 if(!f)return;
 const url=URL.createObjectURL(f.blob);
 const w=window.open(url,'_blank');
 if(!w){
  try{const d=await claude.use('downloads');if(d){await d.save({filename:f.name+'.pdf',data:f.blob});return}}catch(e){}
  alert('Не удалось открыть файл. Попробуйте открыть страницу в Safari.');
 }
}

(async()=>{db=await openDB();mem=!db;refresh()})();
</script>
</body>
</html>
